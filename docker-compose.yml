services:
  redis:
    image: redis:7
    # AOF: every write is appended to a file and replayed on restart.
    # everysec: fsync once a second, so a machine crash loses at most ~1 s of
    # writes; a Redis process crash loses nothing (the OS page cache keeps it).
    # REDIS_AOF=no turns it off for the comparison run.
    command: ["redis-server", "--appendonly", "${REDIS_AOF:-yes}", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  mock-model:
    build: ./mock-model
    ports:
      - "8001:8001"

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    # No restart policy on purpose: a crashed worker must stay down so the loss is visible.
    # init: Python must not be PID 1, because the kernel ignores a SIGKILL that
    # PID 1 sends itself, which would silently disable CRASH_AFTER_POP.
    init: true
    # SIGTERM, then SIGKILL after this long. Must exceed the slowest drain:
    # XAUTOCLAIM (10 s socket) + XPENDING (10 s) + longest hold
    # (10 s + MODEL_TIMEOUT_S 45 s + 10 s) = 85 s.
    stop_grace_period: 90s
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_URL: http://mock-model:8001
      CRASH_AFTER_POP: ${CRASH_AFTER_POP:-0}
    depends_on:
      redis:
        condition: service_healthy
      mock-model:
        condition: service_started

volumes:
  redis-data:
